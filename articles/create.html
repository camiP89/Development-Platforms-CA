<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create and publish a new student news article for the Student Express community."
    />
    <title>Student Express | Create Article</title>
    <script
      src="https://kit.fontawesome.com/bfed71705b.js"
      crossorigin="anonymous"
    ></script>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicon-16x16.png"
    />
    <link rel="manifest" href="/assets/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Young+Serif&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/scripts/pages/createArticle.mjs" type="module"></script>
  </head>

  <body class="grid min-h-screen grid-rows-[auto_1fr_auto] bg-bg">
    <header class="bg-secondary shadow-lg sticky top-0 z-50">
      <nav
        class="container mx-auto px-4 py-2 flex items-center justify-between"
      >
        <a href="/index.html" class="shrink-0">
          <img
            src="/assets/dp-logo.png"
            alt="Student Express logo"
            class="h-8 md:h-10 w-auto"
          />
        </a>

        <div
          id="user-status-bar"
          class="hidden flex-col items-start gap-1 sm:flex-row sm:items-center"
        >
          <p
            id="welcome-text"
            class="text-xs md:hidden lg:block lg:text-base font-medium italic text-primary"
          ></p>
        </div>

        <div class="flex items-center gap-4">
          <div class="hidden md:flex space-x-6 items-center">
            <a
              href="/index.html"
              class="font-medium hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all text-primary"
              >Home</a
            >
            <a
              href="/about/index.html"
              class="font-medium hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all text-primary"
              >About</a
            >

            <div id="logged-in-nav" class="hidden items-center space-x-6">
              <a
                href="/articles/index.html"
                class="font-medium hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all text-primary"
                >Articles</a
              >

              <button
                id="logout-button"
                class="bg-primary text-white px-6 py-1.5 rounded-lg text-sm font-semibold transition-colors duration-200 hover:bg-red-700 hover:text-white active:bg-red-800 focus:ring-2 focus:ring-red-700"
              >
                Log Out
              </button>
            </div>

            <div id="logged-out-nav" class="flex items-center">
              <a
                href="/account/login.html"
                class="bg-primary text-white px-6 py-1.5 rounded-lg text-sm font-semibold transition hover:bg-detail hover:text-text focus:ring-2 focus:ring-detail focus:outline-detail active:bg-detail disabled:opacity-50"
                >Sign In</a
              >
            </div>
          </div>

          <button id="menu-btn" class="p-2 md:hidden block">
            <i class="fa-solid fa-bars text-2xl text-primary"></i>
          </button>
        </div>
      </nav>

      <div
        id="mobile-menu"
        class="hidden md:hidden absolute top-full left-0 w-full bg-bg shadow-lg py-8 z-50"
      >
        <div class="flex flex-col items-center font-sans gap-6">
          <a
            href="/index.html"
            class="font-medium hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all text-primary"
            >Home</a
          >
          <a
            href="/about/index.html"
            class="font-medium hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all text-primary"
            >About</a
          >

          <div
            id="mobile-logged-in-nav"
            class="hidden flex-col items-center gap-6 w-full"
          >
            <a
              href="/articles/"
              class="font-medium hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all text-primary"
              >Articles</a
            >

            <button
              id="mobile-logout-button"
              class="bg-primary text-white px-8 py-2 rounded-lg transition hover:bg-red-700 hover:text-white focus:ring-2 focus:ring-red-700 focus:outline-none active:bg-red-800 disabled:opacity-50"
            >
              Log Out
            </button>
          </div>

          <div
            id="mobile-logged-out-nav"
            class="flex flex-col items-center gap-6 w-full"
          >
            <a
              href="/account/login.html"
              class="text-base bg-primary text-white px-8 py-2 rounded-lg transition hover:bg-detail hover:text-text focus:ring-2 focus:ring-detail focus:outline-detail active:bg-detail disabled:opacity-50"
              >Sign In</a
            >
          </div>
        </div>
      </div>
    </header>
    <main
      class="container mx-auto flex flex-col items-center bg-bg justify-center pb-4 px-4"
    >
      <h1
        class="font-heading mx-auto mb-3 rounded-lg p-2 text-center text-2xl md:text-4xl my-4 font-bold text-primary"
      >
        Create Article
      </h1>
      <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">
        <form id="create-article-container" class="space-y-5">
          <div id="message-container" role="status" aria-live="polite"></div>
          <div>
            <label
              for="article-title"
              class="mb-1 block text-sm font-sans font-semibold text-text/80"
              >Article Title</label
            >
            <input
              class="mb-1 w-full font-sans text-base text-text rounded-lg border border-detail/30 px-4 py-2 focus:ring-2 focus:ring-detail focus:outline-none"
              type="text"
              id="article-title"
              placeholder="Enter article title"
              required
            />
          </div>

          <div>
            <label
              for="article-content"
              class="mb-1 block text-sm font-semibold text-text/80"
            >
              Article Content
            </label>

            <textarea
              class="mb-1 w-full font-sans text-base text-text rounded-lg border border-detail/30 px-4 py-2 focus:ring-2 focus:ring-detail focus:outline-none"
              id="article-content"
              placeholder="Enter article content"
              required
            ></textarea>
          </div>

          <div>
            <label
              for="image-url"
              class="mb-1 block text-sm font-semibold text-text/80"
              >Image URL</label
            >
            <input
              class="mb-1 w-full rounded-lg font-sans text-base text-text border border-detail/30 px-4 py-2 focus:ring-2 focus:ring-detail focus:outline-none"
              type="text"
              id="image-url"
              placeholder="Enter Image URL"
            />
            <img
              id="image-preview"
              class="hidden mt-2 w-full rounded-lg border border-detail/30"
              alt="Image preview"
            />
          </div>

          <div>
            <label
              for="image-alt-text"
              class="mb-1 block text-sm font-semibold text-text/80"
              >Image Alt Text</label
            >
            <input
              class="w-full rounded-lg font-sans text-base text-text border border-detail/30 px-4 py-2 focus:ring-2 focus:ring-detail focus:outline-none"
              type="text"
              id="image-alt-text"
              placeholder="Enter a description of image"
            />
          </div>

          <button
            class="text-base w-full rounded-lg py-2 font-semibold text-white bg-primary shadow-md transition hover:bg-detail hover:text-text focus:ring-2 focus:ring-detail focus:outline-detail active:bg-detail disabled:opacity-50"
            type="submit"
            name="action"
            value="Publish"
          >
            Publish
          </button>
          <button
            class="w-full rounded-lg px-4 py-2 text-base font-bold bg-text/20 text-text shadow-sm transition-colors duration-200 hover:bg-red-700 hover:text-white active:bg-red-800"
            type="button"
            onclick="window.location.href = '../articles/index.html'"
            name="action"
            value="Cancel"
          >
            Cancel
          </button>
        </form>
      </div>
    </main>
    <footer class="bg-secondary p-4 shadow-inner">
      <div class="container mx-auto space-y-4 text-center">
        <a href="/index.html">
          <img
            src="/assets/dp-logo.png"
            alt="Student Express logo"
            class="m-auto h-auto w-28 pb-4 hover:opacity-80 transition-opacity"
          />
        </a>

        <div
          class="flex justify-center font-medium font-sans text-xs sm:text-sm space-x-6"
        >
          <a
            href="/about/index.html"
            class="font-medium hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all text-primary"
            >About</a
          >
          <a
            href="/terms/index.html"
            class="font-medium hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all text-primary"
            >Terms</a
          >
          <a
            href="/privacy/index.html"
            class="hover:text-detail font-medium active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all text-primary"
            >Privacy</a
          >
        </div>
        <div class="flex justify-center space-x-5 text-xl text-primary">
          <a href="https://www.facebook.com" aria-label="Link to Facebook">
            <i
              class="fa-brands fa-square-facebook hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all"
            ></i>
          </a>
          <a href="https://www.instagram.com" aria-label="Link to Instagram">
            <i
              class="fa-brands fa-square-instagram hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all"
            ></i>
          </a>
          <a href="https://www.youtube.com" aria-label="Link to YouTube">
            <i
              class="fa-brands fa-square-youtube hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all"
            ></i>
          </a>
          <a href="https://www.tiktok.com" aria-label="Link to TikTok">
            <i
              class="fa-brands fa-tiktok hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all"
            ></i>
          </a>
          <a href="https://x.com" aria-label="Link to x (formerly Twitter)">
            <i
              class="fa-brands fa-square-x-twitter hover:text-detail active:text-detail hover:underline hover:decoration-detail underline-offset-4 transition-all"
            ></i>
          </a>
        </div>
        <p class="text-sm text-primary">
          Copyright &copy; StudentExpressLtd 2026
        </p>
      </div>
    </footer>
  </body>
</html>
